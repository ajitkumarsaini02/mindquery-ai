<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#logoBg)" />
    <!-- Document Fold -->
    <path d="M26 0v8a2 2 0 0 0 2 2h12" fill="#3730a3" opacity="0.35" />
    <!-- Connected Neural Nodes -->
    <circle cx="14" cy="18" r="3.2" fill="url(#nodeGrad)" />
    <circle cx="26" cy="18" r="3.2" fill="url(#nodeGrad)" />
    <circle cx="20" cy="27" r="3.6" fill="url(#nodeGrad)" />
    <line x1="14" y1="18" x2="26" y2="18" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <line x1="14" y1="18" x2="20" y2="27" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <line x1="26" y1="18" x2="20" y2="27" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  </g>
  <!-- Typography -->
  <text x="56" y="28" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="20" fill="#0f172a" letter-spacing="-0.5">Mind<tspan fill="#6366f1">Query</tspan></text>
  <rect x="175" y="14" width="28" height="18" rx="4" fill="#ede9fe" />
  <text x="180" y="27" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#4f46e5">AI</text>
</svg>

